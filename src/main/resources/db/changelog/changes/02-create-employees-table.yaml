databaseChangeLog:
  - changeSet:
      id: 02-create-employees-table
      author: atlasrh
      changes:
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: matricule
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_employee_matricule
              - column:
                  name: nom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: prenom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_employee_email
              - column:
                  name: poste
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: date_embauche
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_employee_department
                    references: departments(id)
              - column:
                  name: manager_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_employee_manager
                    references: employees(id)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
