databaseChangeLog:
  - changeSet:
      id: 05-create-leave-requests-table
      author: atlasrh
      changes:
        - createTable:
            tableName: leave_requests
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_leave_request_employee
                    references: employees(id)
              - column:
                  name: leave_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_leave_request_type
                    references: leave_types(id)
              - column:
                  name: date_debut
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: date_fin
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: days_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: motif
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: "EN_ATTENTE"
                  constraints:
                    nullable: false
              - column:
                  name: manager_comment
                  type: VARCHAR(500)
              - column:
                  name: decision_date
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
