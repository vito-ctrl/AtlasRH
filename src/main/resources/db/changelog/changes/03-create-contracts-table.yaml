databaseChangeLog:
  - changeSet:
      id: 03-create-contracts-table
      author: atlasrh
      changes:
        - createTable:
            tableName: contracts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_contract_employee
                    references: employees(id)
              - column:
                  name: contract_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: date_debut
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: date_fin
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: salaire_brut
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: actif
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
